# Reference packages (SRS FR-14.9): build the filesystem, git, fetch and
# memory packages from their pinned recipes in packaging/reference, sign
# them with a throwaway test key, import and enable them in a fresh Gateway
# and call one tool of each. Needs the npm and PyPI registries, so it is not
# a required pull-request check; it runs on release tags and on demand.
name: reference-packages

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  reference-packages:
    name: reference-packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.x"
          check-latest: true
          cache-dependency-path: go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Build, sign, import, enable and call each reference package
        env:
          SMCP_PYTHON: /usr/bin/python3
        run: scripts/build-reference-packages.sh "$RUNNER_TEMP/refpkg"
      - name: Upload the packages and the smcpd log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: reference-packages
          path: |
            ${{ runner.temp }}/refpkg/pkg-*
            ${{ runner.temp }}/refpkg/smcpd.log
          if-no-files-found: warn
          retention-days: 14

  # Publishes the result to site-data/workflows.json, where the CI status job
  # reads it into the requirement report (tools/reqreport -workflows). A run
  # on a release tag is a full claim on FR-14.9, a run on any other ref a
  # partial one.
  publish:
    name: publish
    needs: [reference-packages]
    if: >-
      always() && (needs.reference-packages.result == 'success' || needs.reference-packages.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-site-data
      cancel-in-progress: false
    env:
      RESULT: ${{ needs.reference-packages.result }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish the reference-package result to the site-data branch
        run: scripts/publish-workflow-result.sh reference-packages "$RESULT" "$GITHUB_REF_NAME" "$GITHUB_SHA" FR-14.9
